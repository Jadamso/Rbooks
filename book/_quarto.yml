project:
  type: book
book:
  title: "Introductory Economic Statistics: A Data-Driven Approach using R"
  author: "Jordan Adamson"
  reader-mode: true
  date: last-modified
  date-format: "DD.MM.YYYY"
  chapters:
    - index.qmd
    - part: 00_00_GettingStarted.qmd
      chapters:
        - 00_01_FirstSteps.qmd
    - part: 01_00_UnivariateData.qmd
      chapters:
        - 01_02_Data.qmd
        - 01_03_DescriptiveStatistics.qmd
        - 01_04_RandomVariables.qmd
        - 01_05_Sampling.qmd
        - 01_06_PopStatistics.qmd
        - 01_07_Intervals.qmd
        - 01_08_HypothesisTests.qmd
        - 01_09_AdvancedProbability.qmd
        - 01_10_AdvancedEmpirics.qmd
    - part: 02_00_BivariateData.qmd
      chapters:
        - 02_11_BivariateDistributions.qmd
        - 02_12_TwoGroups.qmd
        - 02_13_Associations.qmd
        - 02_14_SimpleRegression.qmd
        - 02_15_LocalRegression.qmd
        - 02_16_Inference.qmd
        - 02_17_NotCausation.qmd
        - 02_18_BivariateProbability.qmd
        - 02_19_StatisticalTheory.qmd
        - 02_20_DataAnalysis.qmd
    - part: 03_00_MultivariateData.qmd
      chapters:
        - 03_21_MultipleRegression.qmd
        - 03_22_MultipleGroups.qmd
        - 03_23_NotCausation.qmd
        - 03_24_InterpretingRegression.qmd
        - 03_25_Regressograms.qmd
        - 03_26_ObservationalData.qmd
        - 03_27_ExperimentalData.qmd
        - 03_28_DataScientism.qmd
        - 03_29_MiscTopics.qmd
  appendices:
    - 04_A_WorkingWithAI.qmd
    - 04_B_CodeStyle.qmd
    - 04_C_Figures.qmd
    - 04_D_Notation.qmd
    - 04_E_Datasets.qmd
  page-navigation: true
  repo-url: https://github.com/Jadamso/Rbooks/
  repo-branch: main
  site-url: https://jadamso.github.io/Rbooks/
  cover-image: Figures_Manual/Logo.png
  favicon: Figures_Manual/Logo.png
  sidebar:
    style: "docked"

  
bibliography: references.bib
lang: en

comments:
  hypothesis: false

format:
  html:
    theme: default
    highlight-style: arrow
    code-fold: true
    code-copy: false
    code-annotations: hover
    toc: false
    section-divs: true
    toc-location: left
    resources:
      - Figures_Manual/**

execute:
  echo: true
  warning: false
  message: false
  freeze: auto # cache; stabilizes builds

knitr:
  opts_chunk:
    collapse: true
    prompt: false
